<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-HEAD-START-->
<title>Laboratorio di curling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!--ARTIFACT-HEAD-END-->
<link rel="stylesheet" href="/src/lab/style.css">
</head>
<body>
<!--ARTIFACT-BODY-START-->
<header class="top">
  <div class="brand">
    <h1 data-t="app.title">Laboratorio di curling</h1>
    <p class="sub" data-t="app.subtitle"></p>
  </div>
  <div class="seg mode" role="radiogroup" data-t-aria="aria.mode" aria-label="Modalità">
    <label><input type="radio" name="mode" id="mode-lab" checked><span data-t="mode.lab"></span></label>
    <label><input type="radio" name="mode" id="mode-end"><span data-t="mode.end"></span></label>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div class="top-tools">
    <button id="sound-btn" class="tool-btn" type="button" aria-pressed="true"></button>
    <div id="lang"></div>
  </div>
</header>

<main class="lab">
  <section class="controls" data-t-aria="aria.controls" aria-label="Comandi">
    <details class="panel end-only" id="p-end" open>
      <summary data-t="section.end"></summary>
      <div class="panel-body">
      <div class="scoreboard">
        <div class="sb-row" id="end-row-0"><i class="dot t0"></i><span class="sb-name" data-t="team.0"></span><span class="sb-hammer" id="end-hammer-0" role="img" data-t-label="end.hammer" title="Hammer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4.5 6.5 9.5 1.5l5 5-1.8 1.8 7.8 7.8a1.6 1.6 0 0 1-2.3 2.3L10.4 10.6 8.6 12.4z" fill="currentColor"/><path d="M3 21h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="pips" id="end-pips-0"></span><b class="sb-points" id="end-points-0"></b></div>
        <div class="sb-row" id="end-row-1"><i class="dot t1"></i><span class="sb-name" data-t="team.1"></span><span class="sb-hammer" id="end-hammer-1" role="img" data-t-label="end.hammer" title="Hammer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4.5 6.5 9.5 1.5l5 5-1.8 1.8 7.8 7.8a1.6 1.6 0 0 1-2.3 2.3L10.4 10.6 8.6 12.4z" fill="currentColor"/><path d="M3 21h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="pips" id="end-pips-1"></span><b class="sb-points" id="end-points-1"></b></div>
      </div>
      <div class="board-wrap"><table id="match-board" class="match-board"></table></div>
      <p id="end-line" class="value"></p>
      <p id="end-shooter" class="hint"></p>
      <p id="end-fgz-state" class="hint"></p>
      <p id="end-msg" class="hint end-msg" role="status"></p>
      <div class="actions secondary">
        <button id="end-undo" type="button" data-t="end.undo"></button>
        <button id="end-new" type="button" data-t="match.new"></button>
        <button id="match-copy" type="button" data-t="match.copy"></button>
      </div>
      <details class="sub-panel">
        <summary data-t="end.settings"></summary>
        <div class="pair">
          <label class="field"><span data-t="match.endsLabel"></span><input id="match-ends" type="number" min="1" max="12" step="1" value="8"></label>
          <label class="field"><span data-t="end.hammerFirst"></span>
            <select id="end-hammer"><option value="1" selected data-t="team.1"></option><option value="0" data-t="team.0"></option></select>
          </label>
        </div>
        <label class="radio"><input type="checkbox" id="match-extra" checked> <span data-t="match.extraLabel"></span></label>
        <div class="pair">
          <label class="field"><span data-t="end.fgzStonesLabel"></span><input id="end-fgz-stones" type="number" min="0" max="15" step="1" value="5"></label>
        </div>
        <label class="radio"><input type="checkbox" id="end-fgz" checked> <span data-t="end.fgzLabel"></span></label>
        <label class="radio"><input type="checkbox" id="end-notick" checked> <span data-t="end.noTickLabel"></span></label>
        <p class="hint" data-t="match.settingsHint"></p>
      </details>
      </div>
    </details>

    <details class="panel end-only" id="p-players">
      <summary data-t="section.players"></summary>
      <div class="panel-body">
      <div id="players"></div>
      <p class="hint" data-t="match.playersHint"></p>
      </div>
    </details>

    <details class="panel" id="p-ice" open>
      <summary data-t="section.ice"></summary>
      <div class="panel-body">
      <label class="field">
        <span data-t="ice.profile"></span>
        <select id="profile">
          <option value="straight" data-t="ice.profile.straight"></option>
          <option value="normal" selected data-t="ice.profile.normal"></option>
          <option value="swingy" data-t="ice.profile.swingy"></option>
        </select>
      </label>
      <div class="pair">
        <label class="field"><span data-t="ice.hogToHog"></span><input id="hh" type="number" min="11" max="18" step="0.1" value="14.5"></label>
        <label class="field"><span data-t="ice.curl"></span><input id="curl" type="number" min="0" max="2.5" step="0.1" value="1.2"></label>
      </div>
      <label class="field">
        <span data-t="ice.collisions"></span>
        <select id="collisions">
          <option value="soft" selected data-t="ice.collisions.soft"></option>
          <option value="normal" data-t="ice.collisions.normal"></option>
          <option value="lively" data-t="ice.collisions.lively"></option>
        </select>
      </label>
      <p class="hint" data-t="ice.collisionsHint"></p>
      <p id="derived" class="hint mono"></p>
    </div>
    </details>

    <details class="panel lab-only" id="p-place" open>
      <summary data-t="section.place"></summary>
      <div class="panel-body">
      <div class="field" role="radiogroup" aria-labelledby="tool-label">
        <span id="tool-label" data-t="place.tool"></span>
        <div class="seg">
          <label><input type="radio" name="tool" id="tool-broom" checked><span data-t="place.toolBroom"></span></label>
          <label><input type="radio" name="tool" id="tool-place"><span data-t="place.toolPlace"></span></label>
        </div>
      </div>
      <div class="pair">
        <div class="field" role="radiogroup" aria-labelledby="place-label">
          <span id="place-label" data-t="place.team"></span>
          <label class="radio"><input type="radio" name="place-team" id="place-0" checked><i class="dot t0"></i><span data-t="team.0"></span></label>
          <label class="radio"><input type="radio" name="place-team" id="place-1"><i class="dot t1"></i><span data-t="team.1"></span></label>
        </div>
        <div class="field" role="radiogroup" aria-labelledby="next-label">
          <span id="next-label" data-t="next.label"></span>
          <label class="radio"><input type="radio" name="next-team" id="next-0" checked><i class="dot t0"></i><span data-t="team.0"></span></label>
          <label class="radio"><input type="radio" name="next-team" id="next-1"><i class="dot t1"></i><span data-t="team.1"></span></label>
        </div>
      </div>
      <div class="actions secondary">
        <button id="copy-scenario" type="button" data-t="scenario.copy"></button>
      </div>
    </div>
    </details>

    <details class="panel" id="p-shot" open>
      <summary data-t="section.shot"></summary>
      <div class="panel-body">
      <div class="field">
        <span data-t="shot.broom"></span>
        <p class="value" id="broom-value"></p>
        <p class="hint" id="tool-hint" data-t="shot.broomHint"></p>
      </div>
      <div class="field" role="radiogroup" aria-labelledby="rot-label">
        <span id="rot-label" data-t="shot.rotation"></span>
        <label class="radio"><input type="radio" name="spin" id="spin-cw" checked> <span>↻</span> <span data-t="shot.cw"></span></label>
        <label class="radio"><input type="radio" name="spin" id="spin-ccw"> <span>↺</span> <span data-t="shot.ccw"></span></label>
      </div>
      <div class="pair">
        <label class="field">
          <span data-t="shot.spinLevel"></span>
          <select id="spin-level">
            <option value="low" data-t="spin.low"></option>
            <option value="normal" selected data-t="spin.normal"></option>
            <option value="high" data-t="spin.high"></option>
            <option value="spinner" data-t="spin.spinner"></option>
            <option value="custom" data-t="spin.custom"></option>
          </select>
        </label>
        <label class="field"><span data-t="shot.spinTurns"></span><input id="spin-turns" type="number" min="0" max="80" step="0.5" value="3.5"></label>
      </div>
      <p id="spin-rate" class="hint mono"></p>
      <div class="field">
        <span data-t="shot.types"></span>
        <div id="shot-types" class="shot-types"></div>
        <p class="hint" data-t="shot.typesHint"></p>
      </div>
      <div class="field">
        <span id="weight-label" data-t="shot.weight"></span>
        <div class="weight-step">
          <button id="w-less" class="step" type="button" data-t-label="shot.weightLess">−</button>
          <span class="value" id="weight-value"></span>
          <button id="w-more" class="step" type="button" data-t-label="shot.weightMore">+</button>
        </div>
        <input id="weight" type="range" min="1.6" max="3.8" step="0.01" value="2.03" aria-labelledby="weight-label">
      </div>
      <label class="field inline">
        <span data-t="shot.splitKind"></span>
        <select id="split-kind">
          <option value="bh" selected data-t="split.bh"></option>
          <option value="th" data-t="split.th"></option>
        </select>
      </label>
      <p id="weight-stop" class="hint"></p>
      <div class="actions inline-actions">
        <button id="throw" class="primary" type="button" data-t="shot.throw"></button>
        <button id="sweep-btn" class="sweep" type="button" data-t="shot.sweep"></button>
        <button id="stop" class="stop" type="button" data-t="shot.stop" hidden></button>
      </div>
      <p class="hint" data-t="shot.sweepHint"></p>
      <p class="hint" data-t="shot.sweepOff"></p>
      <div class="actions secondary">
        <button id="repeat" type="button" data-t="shot.repeat"></button>
        <button id="retry" class="lab-only" type="button" data-t="shot.retry"></button>
        <button id="clear" class="lab-only" type="button" data-t="shot.clear"></button>
      </div>
      <label class="radio"><input type="checkbox" id="show-trails" checked> <span data-t="shot.trails"></span></label>
      <label class="field inline">
        <span data-t="shot.speed"></span>
        <select id="play-speed">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="10">10×</option>
        </select>
      </label>
    </div>
    </details>

    <details class="panel lab-only" id="p-skill" open>
      <summary data-t="section.skill"></summary>
      <div class="panel-body">
      <label class="field">
        <span data-t="skill.shotLevel"></span>
        <select id="shot-level">
          <option value="perfect" selected data-t="level.perfect"></option>
          <option value="beginner" data-t="level.beginner"></option>
          <option value="club" data-t="level.club"></option>
          <option value="elite" data-t="level.elite"></option>
          <option value="custom" data-t="level.custom"></option>
        </select>
      </label>
      <div class="pair">
        <label class="field"><span data-t="skill.line"></span><input id="sk-line" type="number" min="0" max="80" step="1" value="0"></label>
        <label class="field"><span data-t="skill.lineTakeout"></span><input id="sk-line-to" type="number" min="0" max="80" step="1" value="0"></label>
      </div>
      <div class="pair">
        <label class="field"><span data-t="skill.stop"></span><input id="sk-stop" type="number" min="0" max="300" step="5" value="0"></label>
        <p id="sk-mix" class="hint mono align-end"></p>
      </div>
      <div class="pair">
        <label class="field"><span data-t="skill.seed"></span><input id="seed" type="number" step="1" value="1"></label>
      </div>
      <div class="pair">
        <label class="field">
          <span data-t="skill.sweepLevel"></span>
          <select id="sweep-level">
            <option value="beginner" data-t="sweep.beginner"></option>
            <option value="club" selected data-t="sweep.club"></option>
            <option value="elite" data-t="sweep.elite"></option>
            <option value="custom" data-t="level.custom"></option>
          </select>
        </label>
        <label class="field"><span data-t="skill.sweepGain"></span><input id="sweep-gain" type="number" min="0" max="5" step="0.05" value="2.15"></label>
      </div>
      <p id="sweep-readout" class="hint mono"></p>
    </div>
    </details>
  </section>

  <section id="views" class="views" data-t-aria="aria.views" aria-label="Pista">
    <figure class="view house-view">
      <div class="house-wrap">
        <canvas id="house" data-t-aria="aria.house" aria-label="Casa di gioco vista dall'alto"></canvas>
        <div id="splits" class="splits" hidden>
          <div><span data-t="split.backHog"></span><b id="split-bh">—</b></div>
          <div><span data-t="split.hogHog"></span><b id="split-hh">—</b></div>
          <p id="split-err" class="split-err" hidden></p>
        </div>
      </div>
      <figcaption data-t="view.house"></figcaption>
    </figure>
    <figure class="view sheet-view">
      <canvas id="sheet" data-t-aria="aria.sheet" aria-label="Pista intera vista dall'alto"></canvas>
      <figcaption data-t="view.sheet"></figcaption>
    </figure>
    <!-- Comandi di tiro su telefono: subito sotto la casa, nel flusso della pagina. -->
    <div id="fab" class="fab" data-t-aria="aria.shotControls" aria-label="Comandi di tiro">
      <div class="fab-row">
        <button id="fab-spin" class="fab-spin" type="button" data-t-label="fab.spinLabel"></button>
        <button id="fab-throw" class="primary" type="button" data-t="shot.throw"></button>
        <button id="fab-rate" type="button" data-t="fb.rate" hidden></button>
        <button id="fab-stop" class="stop" type="button" data-t="shot.stop" hidden></button>
      </div>
      <label id="fab-weight-row" class="fab-weight">
        <span class="fab-weight-label"><b id="fab-weight-value"></b> <span id="fab-weight-stop"></span></span>
        <input id="fab-weight" type="range" min="1.6" max="3.8" step="0.01" value="2.03" data-t-label="fab.weightLabel">
      </label>
      <div id="sweep-pad" class="sweep-pad" role="group" data-t-aria="sweep.padLabel" aria-label="Pad di spazzata" hidden>
        <div class="zone" data-zone="-1"><b id="zone-left-name"></b><span id="zone-left-sub"></span></div>
        <div class="zone zone-hard" data-zone="0"><b data-t="sweep.hard"></b><span data-t="sweep.hardSub"></span></div>
        <div class="zone" data-zone="1"><b id="zone-right-name"></b><span id="zone-right-sub"></span></div>
        <span class="pad-strong" data-t="sweep.strong" aria-hidden="true"></span>
        <span class="pad-light" data-t="sweep.light" aria-hidden="true"></span>
        <span id="pad-dot" class="pad-dot" hidden></span>
        <span id="pad-status" class="pad-status" aria-live="polite"></span>
      </div>
    </div>
  </section>

  <section class="data">
    <details class="panel" id="p-feedback" open>
      <summary data-t="section.feedback"></summary>
      <div class="panel-body">
      <div id="fb-current" class="fb-current"></div>
      <p id="fb-empty" class="hint" data-t="fb.none"></p>
      <div class="fb-collected">
        <p id="fb-count" class="value"></p>
        <div class="actions">
          <button id="fb-upload" class="primary-plain" type="button" data-t="fb.upload"></button>
        </div>
        <label id="fb-code-row" class="field" hidden>
          <span data-t="fb.code"></span>
          <input id="fb-code" type="text" autocomplete="off" spellcheck="false">
        </label>
        <p id="fb-msg" class="hint" role="status"></p>
        <p class="hint" data-t="fb.uploadHint"></p>
        <div class="actions secondary">
          <button id="fb-copy" type="button" data-t="fb.copy"></button>
          <a id="fb-send" class="button-link" href="#" data-t="fb.send"></a>
          <button id="fb-clear" type="button" data-t="fb.clear"></button>
        </div>
        <p id="fb-to" class="hint mono"></p>
        <p class="hint" data-t="fb.mailHint"></p>
      </div>
      </div>
    </details>

    <details class="panel" id="p-log" open>
      <summary data-t="section.log"></summary>
      <div class="panel-body">
      <p id="log-empty" class="hint" data-t="log.empty"></p>
      <div class="table-wrap">
        <table id="log-table" hidden>
          <thead>
            <tr>
              <th data-t="log.n"></th><th data-t="log.rot"></th><th data-t="log.speed"></th>
              <th data-t="log.bh"></th><th data-t="log.hh"></th><th data-t="log.ht"></th><th data-t="log.stop"></th>
              <th data-t="log.curl"></th><th data-t="log.turns"></th><th data-t="log.sweep"></th><th data-t="log.err"></th>
              <th data-t="log.outcome"></th><th data-t="log.hash"></th>
            </tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
      <p class="hint" data-t="log.legend"></p>
      </div>
    </details>

    <details class="panel" id="p-replay" open>
      <summary data-t="section.replay"></summary>
      <div class="panel-body">
      <label class="field">
        <span data-t="replay.textLabel"></span>
        <textarea id="replay-text" rows="6" spellcheck="false"></textarea>
      </label>
      <div class="actions secondary">
        <button id="copy-replay" type="button" data-t="replay.save"></button>
        <button id="load-text" type="button" data-t="replay.load"></button>
        <label class="file"><input id="load-file" type="file" accept="application/json,.json"><span data-t="replay.fromFile"></span></label>
      </div>
      <p id="replay-msg" class="hint" role="status"></p>
      <div class="actions secondary">
        <button id="det-check" type="button" data-t="replay.check"></button>
      </div>
      <p id="det-result" class="hint"></p>
      </div>
    </details>
  </section>
</main>
<div id="decision" class="sheet" role="dialog" aria-labelledby="decision-text" hidden>
  <p id="decision-text"></p>
  <div id="decision-choice" class="actions secondary">
    <button id="decision-leave" type="button" data-t="end.choiceLeave"></button>
    <button id="decision-restore" class="primary-plain" type="button" data-t="end.choiceRestore"></button>
  </div>
  <div id="decision-result" class="actions secondary" hidden>
    <button id="decision-new" type="button" class="primary-plain" data-t="end.new"></button>
    <button id="decision-close" type="button" data-t="end.close"></button>
  </div>
</div>
<!--ARTIFACT-BODY-END-->
<script type="module" src="/src/lab/main.ts"></script>
</body>
</html>
