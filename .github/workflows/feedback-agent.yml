# Agente delle segnalazioni: legge i rapporti inviati dal laboratorio (reports/feedback/inbox/)
# e, se configurata, la casella dei giudizi via IMAP (sola lettura); valuta i nuovi rapporti e
# pubblica i risultati in reports/feedback/.
name: Agente segnalazioni

on:
  schedule:
    - cron: "17 */2 * * *" # ogni due ore, al minuto 17 (UTC)
  workflow_dispatch: {}
  # Rapporti inviati dal laboratorio: la funzione su Vercel li salva qui con un commit.
  push:
    branches: [main]
    paths:
      - "reports/feedback/inbox/**"

permissions:
  contents: write

concurrency:
  group: feedback-agent
  cancel-in-progress: false

jobs:
  valuta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sempre l'ultimo main, non il commit dell'evento: un'esecuzione rilanciata o rimasta in coda
      # partirebbe altrimenti da un data.json vecchio e rielaborerebbe messaggi già valutati.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa le dipendenze
        run: npm install --no-audit --no-fund
      # L'agente è idempotente (salta i messaggi già in data.json): se main è cambiato nel frattempo
      # non si fondono i rapporti, si riparte dall'ultimo main e si rielabora. Fino a tre tentativi.
      - name: Leggi, valuta e pubblica le segnalazioni
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
        run: |
          git config user.name "curlsim-feedback-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run agent
            git add reports/feedback
            if git diff --cached --quiet; then
              echo "Nessuna novità da pubblicare."
              exit 0
            fi
            git commit -m "Segnalazioni: aggiornamento automatico"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main è cambiato durante la valutazione: nuovo tentativo ($attempt)."
            sleep 5
          done
          echo "Impossibile pubblicare dopo tre tentativi."
          exit 1
